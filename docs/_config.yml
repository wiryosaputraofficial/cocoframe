title: CocoFrame Documentation
description: Server-first TypeScript web framework and AI-assisted product engineering workflow.
url: https://wiryosaputraofficial.github.io
baseurl: /cocoframe
repository: wiryosaputraofficial/cocoframe
lang: en
timezone: Asia/Jakarta
logo: /assets/brand/cocoframe-logo-horizontal.png

plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: true

titles_from_headings:
  enabled: true
  strip_title: true
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: pretty
